<div class="menu-container bg-theme text-theme min-h-screen p-6">
  <!-- Category Filter Tabs -->
  <div class="category-tabs mb-8">
    <div class="flex flex-wrap gap-3">
      <button 
        *ngFor="let category of categories"
        (click)="selectCategory(category)"
        [class]="'category-btn px-6 py-3 rounded-full font-medium transition-all duration-300 ' + 
                 (selectedCategory === category ? 'active' : '')"
      >
        <i [class]="getCategoryIcon(category)" class="mr-2"></i>
        {{ category }}
      </button>
    </div>
  </div>

  <!-- Menu Items Grid -->
  <div class="menu-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div 
      *ngFor="let item of filteredItems" 
      class="menu-card bg-white dark:bg-gray-800 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1"
    >
      <!-- Food Image -->
      <div class="image-container relative overflow-hidden">
        <img 
          [src]="item.image" 
          [alt]="item.name"
          class="w-full h-48 object-cover transition-transform duration-300 hover:scale-105"
        />
        <div class="image-overlay absolute inset-0 bg-black bg-opacity-0 hover:bg-opacity-20 transition-all duration-300"></div>
      </div>
      
      <!-- Card Content -->
      <div class="card-content p-6">
        <!-- Food Name -->
        <h3 class="food-name text-xl font-bold text-gray-800 dark:text-white mb-2 line-clamp-1">
          {{ item.name }}
        </h3>
        
        <!-- Description -->
        <p class="food-description text-gray-600 dark:text-gray-300 text-sm mb-4 line-clamp-2 leading-relaxed">
          {{ item.description }}
        </p>
        
        <!-- Price and Add Button -->
        <div class="flex items-center justify-between">
          <div class="price-section">
            <span class="price text-2xl font-bold text-orange-500">
              ฿{{ item.price }}
            </span>
          </div>
          
          <button 
            (click)="addToCart(item)"
            class="add-btn bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-full font-medium transition-all duration-300 flex items-center gap-2 hover:scale-105 active:scale-95"
          >
            <i class="fas fa-plus"></i>
            Add
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredItems.length === 0" class="empty-state text-center py-16">
    <div class="text-6xl text-gray-300 dark:text-gray-600 mb-4">
      <i class="fas fa-utensils"></i>
    </div>
    <h3 class="text-xl font-semibold text-gray-600 dark:text-gray-400 mb-2">
      No items found
    </h3>
    <p class="text-gray-500 dark:text-gray-500">
      Try selecting a different category
    </p>
  </div>

  <!-- Floating Cart Button -->
  <div 
    *ngIf="cartCount > 0"
    class="floating-cart-btn fixed bottom-6 right-6 z-50"
    (click)="openCartModal()"
  >
    <div class="cart-btn bg-orange-500 hover:bg-orange-600 text-white rounded-full p-4 shadow-2xl cursor-pointer transition-all duration-300 hover:scale-110 active:scale-95">
      <i class="fas fa-shopping-cart text-2xl"></i>
      <div class="cart-badge absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-7 h-7 flex items-center justify-center text-sm font-bold">
        {{ cartCount }}
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div 
    *ngIf="showCartModal" 
    class="cart-modal-overlay fixed inset-0 bg-black bg-opacity-50 z-[9999] flex items-center justify-center p-4"
    (click)="closeCartModal()"
  >
    <div 
      class="cart-modal bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full max-h-[90vh] overflow-hidden shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <!-- Modal Header -->
      <div class="modal-header bg-orange-500 text-white p-4 flex items-center justify-between">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <i class="fas fa-shopping-cart"></i>
          ออร์เดอร์ของคุณ
        </h2>
        <button 
          (click)="closeCartModal()"
          class="text-white hover:text-orange-200 transition-colors"
        >
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>

      <!-- Cart Items -->
      <div class="cart-items max-h-96 overflow-y-auto">
        <div *ngIf="cartItems.length === 0" class="empty-cart text-center py-8">
          <i class="fas fa-shopping-cart text-4xl text-gray-300 mb-4"></i>
          <p class="text-gray-500">ตะกร้าของคุณว่างเปล่า</p>
        </div>

        <div *ngFor="let item of cartItems" class="cart-item flex items-center gap-4 p-4 border-b border-gray-100 dark:border-gray-700">
          <!-- Item Image -->
          <div class="item-image w-16 h-16 rounded-lg overflow-hidden flex-shrink-0">
            <img [src]="item.image" [alt]="item.name" class="w-full h-full object-cover">
          </div>

          <!-- Item Details -->
          <div class="item-details flex-1 min-w-0">
            <h4 class="item-name font-semibold text-gray-800 dark:text-white text-sm truncate">
              {{ item.name }}
            </h4>
            <p class="item-price text-orange-500 font-bold text-sm">
              ฿{{ item.price }}
            </p>
          </div>

          <!-- Quantity Controls -->
          <div class="quantity-controls flex items-center gap-2">
            <button 
              (click)="updateCartItemQuantity(item.id, item.quantity - 1)"
              class="qty-btn bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-300 w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors"
            >
              <i class="fas fa-minus text-xs"></i>
            </button>
            
            <span class="quantity text-gray-800 dark:text-white font-semibold min-w-[2rem] text-center">
              {{ item.quantity }}
            </span>
            
            <button 
              (click)="updateCartItemQuantity(item.id, item.quantity + 1)"
              class="qty-btn bg-orange-500 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-orange-600 transition-colors"
            >
              <i class="fas fa-plus text-xs"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Cart Footer -->
      <div *ngIf="cartItems.length > 0" class="cart-footer p-4 bg-gray-50 dark:bg-gray-700">
        <!-- Total -->
        <div class="total-section flex items-center justify-between mb-4 pb-4 border-b border-gray-200 dark:border-gray-600">
          <span class="total-label text-lg font-semibold text-gray-800 dark:text-white">
            ยอดรวมทั้งหมด:
          </span>
          <span class="total-amount text-2xl font-bold text-orange-500">
            ฿{{ cartTotal.toFixed(2) }}
          </span>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons space-y-2">
          <button 
            class="order-btn w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition-all duration-300 hover:scale-105 active:scale-95"
          >
            <i class="fas fa-check mr-2"></i>
            สั่งออร์เดอร์
          </button>
          
          <button 
            (click)="clearCart()"
            class="clear-btn w-full bg-gray-300 dark:bg-gray-600 hover:bg-gray-400 dark:hover:bg-gray-500 text-gray-700 dark:text-gray-300 py-2 rounded-xl font-medium transition-colors"
          >
            <i class="fas fa-trash mr-2"></i>
            ล้างตะกร้า
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
