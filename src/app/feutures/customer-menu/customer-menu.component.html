<div class="menu-container bg-login-theme min-h-screen px-4 py-6 pb-8">

  <!-- Search Bar -->
  <div class="search-container">
    <div class="search-wrapper relative max-w-md mx-auto">
      <div class="search-input-container relative">
        <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-login-secondary text-lg"></i>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="ค้นหาเมนูอาหาร..."
          class="search-input w-full pl-12 pr-12 py-4 rounded-2xl bg-white border-2 border-gray-200 focus:border-[#94694c] focus:outline-none text-login-primary placeholder-login-secondary shadow-lg transition-all duration-300"
        />
        <button
          *ngIf="searchTerm"
          (click)="clearSearch()"
          class="clear-search-btn absolute right-4 top-1/2 transform -translate-y-1/2 text-login-secondary hover:text-login-accent transition-colors"
        >
          <i class="fas fa-times text-lg"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Category Filter Tabs - Horizontal Scrollable -->
  <div class="category-tabs-container sticky top-0 z-40 bg-white/95 backdrop-blur-md rounded-2xl mx-4 my-8 p-6 shadow-lg border border-gray-200">
    <div class="overflow-x-auto scrollbar-hide">
      <div class="flex gap-3 min-w-max pb-2 justify-center">
        <button
          *ngFor="let category of categories"
          (click)="selectCategory(category)"
          [class]="'category-btn px-6 py-3 rounded-full font-medium transition-all duration-300 whitespace-nowrap flex-shrink-0 ' +
                   (selectedCategory === category ? 'active' : '')"
        >
          <i [class]="getCategoryIcon(category)" class="mr-2"></i>
          {{ category }}
        </button>
      </div>
    </div>
  </div>

  <!-- Menu Items Grid -->
  <!-- Loading State -->
  <div *ngIf="isLoadingMenu" class="flex justify-center items-center py-12">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#94694c] mx-auto mb-4"></div>
      <p class="text-[#8a6b55] font-medium">กำลังโหลดเมนู...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="menuError && !isLoadingMenu" class="bg-red-50 border border-red-200 rounded-2xl p-6 mx-4 mb-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fas fa-exclamation-circle text-red-500 text-xl"></i>
        <div>
          <h3 class="font-semibold text-red-800">เกิดข้อผิดพลาด</h3>
          <p class="text-red-600 text-sm">{{ menuError }}</p>
        </div>
      </div>
      <button
        (click)="loadMenu()"
        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
      >
        <i class="fas fa-redo mr-2"></i>
        ลองใหม่
      </button>
    </div>
  </div>

  <!-- Menu Items Grid (only show when not loading and no error) -->
  <div *ngIf="!isLoadingMenu && !menuError" class="menu-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div
      *ngFor="let item of filteredItems"
      class="menu-card card-login-theme rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1"
    >
      <!-- Food Image -->
      <div class="image-container relative overflow-hidden">
        <img
          [src]="item.imageUrl || item.image || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2Y5ZjlmOSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE0cHgiIGZpbGw9IiM5OTkiPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='"
          [alt]="item.name"
          class="w-full h-48 object-cover transition-transform duration-300 hover:scale-105"
          (error)="$event.target.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2Y5ZjlmOSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE0cHgiIGZpbGw9IiM5OTkiPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='"
        />
        <div class="image-overlay absolute inset-0 bg-black bg-opacity-0 hover:bg-opacity-20 transition-all duration-300"></div>
      </div>

      <!-- Card Content -->
      <div class="card-content p-6">
        <!-- Food Name -->
        <h3 class="food-name text-xl font-bold text-login-primary mb-2 line-clamp-1">
          {{ item.name }}
        </h3>

        <!-- Description -->
        <p class="food-description text-login-secondary text-sm mb-4 line-clamp-2 leading-relaxed">
          {{ item.description }}
        </p>

        <!-- Price and Add Button -->
        <div class="flex items-center justify-between">
          <div class="price-section">
            <span class="price text-2xl font-bold" style="color: #5c3d2e;">
              ฿{{ item.price }}
            </span>
          </div>

          <!-- Show quantity controls if item is in cart, otherwise show add button -->
          <div *ngIf="getItemQuantityInCart(item.id) > 0; else addButton" class="quantity-controls flex items-center gap-3">
            <button
              (click)="updateItemQuantityById(item.id, getItemQuantityInCart(item.id) - 1)"
              class="quantity-btn minus w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center transition-colors"
            >
              <i nz-icon nzType="minus" nzTheme="outline" class="text-gray-600"></i>
            </button>

            <span class="quantity-display min-w-[2rem] text-center font-bold text-login-primary">
              {{ getItemQuantityInCart(item.id) }}
            </span>

            <button
              (click)="updateItemQuantityById(item.id, getItemQuantityInCart(item.id) + 1)"
              class="quantity-btn plus w-8 h-8 rounded-full bg-[#94694c] hover:bg-[#7a5a3f] text-white flex items-center justify-center transition-colors"
            >
              <i nz-icon nzType="plus" nzTheme="outline" class="text-white"></i>
            </button>
          </div>

          <ng-template #addButton>
            <button
              (click)="addToCart(item)"
              class="add-btn px-6 py-2 rounded-full font-medium transition-all duration-300 flex items-center gap-2 hover:scale-105 active:scale-95 text-white"
              style="background-color: #94694c;"
            >
              <i nz-icon nzType="plus" nzTheme="outline"></i>
              ตระกร้าสินค้า
            </button>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredItems.length === 0" class="empty-state text-center py-16">
    <div class="text-6xl text-gray-300 dark:text-gray-600 mb-4">
      <i class="fas fa-search"></i>
    </div>
    <h3 class="text-xl font-semibold text-gray-600 dark:text-gray-400 mb-2">
      <span *ngIf="searchTerm">ไม่พบเมนูที่ค้นหา</span>
      <span *ngIf="!searchTerm && selectedCategory !== 'All'">ไม่มีเมนูในหมวดหมู่นี้</span>
      <span *ngIf="!searchTerm && selectedCategory === 'All'">ไม่มีเมนูอาหาร</span>
    </h3>
    <p class="text-gray-500 dark:text-gray-500">
      <span *ngIf="searchTerm">ลองค้นหาด้วยคำอื่น หรือ</span>
      <button
        *ngIf="searchTerm"
        (click)="clearSearch()"
        class="text-orange-500 hover:text-orange-600 underline ml-1"
      >
        ล้างการค้นหา
      </button>
      <span *ngIf="!searchTerm">ลองเลือกหมวดหมู่อื่น</span>
    </p>
  </div>
</div>
