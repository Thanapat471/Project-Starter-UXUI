<aside class="app-sidebar" [class.collapsed]="collapsed">

  <ul nz-menu nzMode="inline" nzSelectable class="sidebar-menu">
    <ng-container *ngFor="let item of items">
      <li nz-menu-item nzMatchRouter [routerLink]="item.route" nzMatchRouterExact>
        <span nz-icon [nzType]="item.icon"></span>
        <span class="menu-label" *ngIf="!collapsed">{{ item.label }}</span>
      </li>
    </ng-container>
  </ul>
</aside>
