<header class="app-navbar">
  <div class="nav-left">
    <button nz-button nzType="text" nzShape="circle" class="collapse-trigger" (click)="toggleSidebar()">
      <span nz-icon [nzType]="collapsed ? 'menu-unfold' : 'menu-fold'"></span>
    </button>
    <div class="nav-brand">
      <div class="nav-brand-icon">
        <span nz-icon nzType="coffee"></span>
      </div>
      <div class="nav-brand-copy">
        <span class="brand-title">Cafe POS</span>
        <span class="brand-subtitle">Staff Panel</span>
      </div>
    </div>
  </div>

  <div class="nav-right">
    <button nz-button nzType="text" nzShape="circle" class="nav-icon">
      <nz-badge nzDot>
        <span nz-icon nzType="bell"></span>
      </nz-badge>
    </button>

    <div class="nav-profile">
      <nz-avatar nzIcon="user" nzSize="small"></nz-avatar>
      <span class="profile-name">{{ userName() }}</span>
    </div>

    <button nz-button nzType="default" class="nav-logout" (click)="logout()">
      <span nz-icon nzType="logout"></span>
      <span class="logout-label">ออกจากระบบ</span>
    </button>
  </div>
</header>
