<div class="flex gap-2 items-center">
  <span class="font-semibold mr-2 text-blue-600 text-lg">🌐</span>
  <button
    *ngFor="let lang of languages"
    (click)="switchLanguage(lang.code)"
    [class.bg-blue-600]="currentLang === lang.code"
    [class.text-white]="currentLang === lang.code"
    [class.bg-gray-100]="currentLang !== lang.code"
    [class.text-gray-800]="currentLang !== lang.code"
    class="px-3 py-1 rounded-full transition-colors duration-200 border border-gray-300 hover:bg-blue-500 hover:text-white font-medium shadow-sm"
  >
    {{ lang.label }}
  </button>
</div>
