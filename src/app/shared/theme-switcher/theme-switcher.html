<div class="relative inline-block">
  <button
    class="flex items-center gap-2 px-3 py-1 rounded-full border font-medium shadow-sm transition"
    (click)="toggleDropdown()"
    aria-label="Change theme"
  >
    <span class="text-xl">🎨</span>
    <span class="hidden md:inline font-semibold">Theme</span>
  </button>
  <div
    *ngIf="dropdownOpen"
    class="absolute right-0 mt-2 w-72 rounded-xl shadow-lg border z-50 p-4 flex flex-col gap-4"
  >
    <div *ngFor="let theme of themes" class="mb-2">
      <button
        (click)="selectTheme(theme.file)"
        class="w-full flex items-center gap-4 p-2 rounded-lg border transition-all duration-200"
        [class.bg-primary]="theme.file === currentTheme"
      >
        <span class="font-semibold text-sm">{{ theme.label }}</span>
        <span class="text-xs" *ngIf="theme.file === currentTheme">Current</span>
      </button>
    </div>
    <button
      class="mt-2 text-xs transition"
      (click)="dropdownOpen = false"
    >Close</button>
  </div>
</div>
